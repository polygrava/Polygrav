<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>polygrav.com — Ιστοσελίδα Χρόνη (Υπό κατασκευή)</title>
  <meta name="description" content="Η προσωπική ιστοσελίδα του Χρόνη (Polygrav). Υπό κατασκευή — σύντομα βιογραφικό, έργα και side projects, και ότι προκύψει. Φαντασία να έχουμε!." />
  <!-- Δεν θέλουμε να ευρετηριαστεί προσωρινά -->  <meta name="theme-color" content="#0f172a" />
  <style>
    :root {
      --bg: #0b1220; /* dark */
      --fg: #e2e8f0;
      --muted: #94a3b8;
      --accent: #22d3ee;
      --card: #0f172a;
      --shadow: 0 12px 30px rgba(0,0,0,.35);
    }
    @media (prefers-color-scheme: light) {
      :root { --bg:#ffffff; --fg:#0f172a; --muted:#475569; --card:#f8fafc; --accent:#0891b2; }
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0; font:16px/1.6 system-ui,-apple-system,Segoe UI,Roboto,Inter,Arial,sans-serif;
      color:var(--fg); background:
        radial-gradient(1200px 600px at -10% -10%, rgba(34,211,238,.10), transparent),
        radial-gradient(900px 500px at 110% -20%, rgba(59,130,246,.08), transparent),
        var(--bg);
      display:grid; place-items:center;
    }
    main{width:min(820px, 92vw); text-align:center}
    .card{background:var(--card); border:1px solid rgba(255,255,255,.08); border-radius:18px; padding:28px 22px; box-shadow:var(--shadow)}
    h1{margin:.2rem 0 .4rem; font-size:clamp(26px, 4.5vw, 40px); line-height:1.2}
    p{margin:.4rem 0}
    .muted{color:var(--muted)}
    .dots::after{content:"…"; display:inline-block; width:1.2em; text-align:left; animation: ellipsis 1.2s steps(3,end) infinite}
    @keyframes ellipsis { 0%{ content:"" } 33%{ content:"." } 66%{ content:".." } 100%{ content:"..." } }
    .row{display:flex; justify-content:center; gap:.6rem; flex-wrap:wrap; margin-top:10px}
    a.btn{ display:inline-block; padding:.7rem 1rem; border-radius:.8rem; text-decoration:none; font-weight:700; border:1px solid rgba(255,255,255,.15); color:var(--fg) }
    a.btn:hover{ background:rgba(255,255,255,.06) }
    footer{ position:fixed; inset:auto 0 10px 0; text-align:center; font-size:.9rem; color:var(--muted) }
  </style>
  <meta property="og:title" content="polygrav.com — Ιστοσελίδα Χρόνη" />
  <meta property="og:description" content="Υπό κατασκευή — σύντομα βιογραφικό, έργα και side projects, και ότι προκύψει. Φαντασία να έχουμε!." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://www.polygrav.com" />
</head>
<body>
  <main>
    <div class="card" role="status" aria-live="polite">
      <div style="font-weight:800; letter-spacing:.02em; color:var(--accent);">polygrav.com</div>
      <h1>Είμαι η ιστοσελίδα του Χρόνη</h1>
      <p class="muted">και είμαι <strong>υπό κατασκευή</strong><span class="dots" aria-hidden="true"></span></p>
      <p class="muted">Σύντομα θα προστεθούν βιογραφικό, έργα και side projects.</p>
      <div class="row">
        <!-- Βάλε εδώ αν θες προσωρινά links επικοινωνίας -->
        <!-- Παράδειγμα: <a class="btn" href="mailto:hello@polygrav.com">hello@polygrav.com</a> -->
        <!-- Παράδειγμα: <a class="btn" href="https://www.linkedin.com/">LinkedIn</a> -->
      </div>
    </div>
  </main>
  <footer>© <span id="y"></span> Polygrav • Temporary page</footer>
  <script>document.getElementById('y').textContent = new Date().getFullYear()</script>
</body>
</html>
